<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Project Tracker</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main>
        <header>
            <h1 id="main-title">Student Project Tracker</h1>
            <p>Track our electronics project ideas.</p>
        </header>

        <section id="form-section">
            <h2 id="form-title">Add Project</h2>
            <form id="project-form">
                <div>
                    <label for="name">Project Name:</label>
                    <input type="text" id="name" required maxlength="80" placeholder="Enter project name">
                </div>

                <div>
                    <label for="status">Status:</label>
                    <select id="status">
                        <option value="Planned">Planned</option>
                        <option value="In Progress">In Progress</option>
                        <option value="Completed">Completed</option>
                    </select>
                </div>

                <button id="save-button" type="submit">Add Project</button>
                <button id="cancel-button" type="button" style="display: none;">Cancel</button>
            </form>
            <p id="message" role="status" aria-live="polite"></p>
        </section>

        <section id="list-section">
            <h2 id="list-title">Projects</h2>
            <p id="empty-state">No projects added yet.</p>
            <ul id="project-list"></ul>
        </section>
    </main>
</body>
</html>
